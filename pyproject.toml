[project]
name = "nairobi-flood-cat-model"
version = "0.1.0"
description = "Deterministic flood loss engine for the Team A Nairobi Urban Flood Challenge"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pandas>=3.0",
]

[project.optional-dependencies]
dev = ["pytest"]
# Hazard raster lookup (loss_engine.hazard_lookup, Checkpoint 8.3).
geo = ["rasterio==1.5.2"]
# Exposure-file adapter (adapter/): openpyxl reads .xlsx input through pandas.
adapter = ["openpyxl==3.1.5"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["loss_engine", "adapter"]

[tool.setuptools.package-data]
adapter = ["config/*.json", "data_manifest.json"]
