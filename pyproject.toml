[project]
name = "nairobi-flood-cat-model"
version = "0.1.0"
description = "Deterministic flood loss engine for the Team A Nairobi Urban Flood Challenge"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pandas>=3.0",
]

[project.optional-dependencies]
dev = ["pytest"]
geo = ["rasterio==1.5.2"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["loss_engine"]
