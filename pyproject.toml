[project]
name = "nairobi-flood-cat-model"
version = "0.1.0"
description = "Deterministic flood loss engine for the Team A Nairobi Urban Flood Challenge"
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "pandas>=3.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "reportlab"]
adapter = [
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "rasterio>=1.4",
    "openpyxl>=3.1",
    "joblib>=1.4",
    "pdfplumber>=0.11",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]
geo = ["rasterio==1.5.2"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["loss_engine", "adapter", "api"]

[tool.setuptools.package-data]
api = ["static/*.html"]
adapter = ["config/*.json", "data_manifest.json"]